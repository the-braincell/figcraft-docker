name: Container smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCP_API_KEY: ci-only-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - run: mkdir workspace && chmod 777 workspace
      - run: docker compose -f compose.headless.yaml config --quiet
      - run: docker compose -f compose.headless.yaml up -d --build --wait
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose -f compose.headless.yaml logs
      - if: always()
        run: docker compose -f compose.headless.yaml down
