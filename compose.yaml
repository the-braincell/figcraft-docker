services:
  mcp:
    build:
      context: .
      args:
        FIGCRAFT_IMAGE: ${FIGCRAFT_IMAGE:-junkerderprovinz/figcraft:0.18.1}
        SUPERGATEWAY_VERSION: ${SUPERGATEWAY_VERSION:-4.2.4}
    image: figcraft-mcp:local
    restart: unless-stopped
    init: true
    user: '1000:1000'
    environment:
      MCP_MODE: attached
      CONTROL_PORT: ${CONTROL_PORT:-7979}
      SUPERGATEWAY_API_KEY: ${MCP_API_KEY:?Set MCP_API_KEY in .env}
      HOME: /tmp
    network_mode: container:${FIGCRAFT_CONTAINER:-figcraft}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
