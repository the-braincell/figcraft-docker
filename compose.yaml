services:
  figcraft:
    build:
      context: .
      args:
        FIGCRAFT_IMAGE: ${FIGCRAFT_IMAGE:-junkerderprovinz/figcraft:latest}
        SUPERGATEWAY_VERSION: ${SUPERGATEWAY_VERSION:-4.2.4}
    image: figcraft-docker:local
    container_name: figcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3001}:3001"
      - "${MCP_BIND:-0.0.0.0}:${MCP_PORT:-8000}:8000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      CUSTOM_USER: ${WEB_USER:-figcraft}
      PASSWORD: ${WEB_PASSWORD:-}
      SELKIES_ENABLE_BASIC_AUTH: "${WEB_AUTH:-false}"
      MCP_API_KEY: ${MCP_API_KEY:?Set MCP_API_KEY}
    volumes:
      - ${CONFIG_DIR:-./appdata}:/config
      - ${STORAGE_DIR:-./storage}:/storage
    healthcheck:
      test: [CMD, node, -e, "Promise.all([fetch('http://127.0.0.1:8000/healthz').then(r=>{if(!r.ok)throw Error('gateway')}),new Promise((resolve,reject)=>{const s=require('net').connect(7979,'127.0.0.1',()=>{s.end();resolve()});s.on('error',reject)})]).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
